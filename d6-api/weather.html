<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 날씨</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #667085;
    --border: #e3e7ee;
    --accent: #2f6fde;
    --error-bg: #fff2f0;
    --error-text: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b1f29;
      --text: #e8ebf2;
      --muted: #98a2b3;
      --border: #2c3240;
      --accent: #6c9cf0;
      --error-bg: #2d1a1a;
      --error-text: #f97066;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .place { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  .now { display: flex; align-items: center; gap: 16px; }
  .emoji { font-size: 64px; line-height: 1; }
  .temp { font-size: 48px; font-weight: 700; line-height: 1.1; }
  .desc { font-size: 18px; margin-top: 2px; }
  .details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 20px 0 0;
    padding: 16px 0 0;
    border-top: 1px solid var(--border);
  }
  .details dt { color: var(--muted); font-size: 12px; }
  .details dd { margin: 0; font-weight: 600; }
  .basis { color: var(--muted); font-size: 13px; margin: 16px 0 0; }

  .loading { color: var(--muted); }
  .error {
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 12px;
    padding: 16px;
  }
  .error button {
    margin-top: 8px;
    padding: 6px 14px;
    border: 1px solid currentColor;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }

  .source { color: var(--muted); font-size: 13px; margin: 16px 0 0; }
  .source a { color: var(--accent); }

  .api-box {
    margin-top: 32px;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    font-size: 13px;
  }
  .api-box h2 { font-size: 15px; margin: 0 0 8px; }
  .api-box code {
    display: block;
    word-break: break-all;
    background: var(--bg);
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .api-box a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>우리 동네 날씨</h1>
  <p class="place" id="place"></p>

  <section class="card" id="weather-card">
    <p class="loading">날씨를 불러오는 중이에요…</p>
  </section>

  <p class="source">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></p>

  <section class="api-box">
    <h2>🔌 이 화면이 쓰는 API</h2>
    <code id="api-url"></code>
    <a id="api-link" href="#" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기</a>
  </section>
</main>

<script>
  // ── 우리 동네 설정: 이름과 위도·경도를 바꾸면 다른 동네 날씨가 나와요 ──
  const PLACE = { name: "서울 중구", latitude: 37.5665, longitude: 126.9780 };

  const API = {
    // 🔌 Open-Meteo 날씨 예보 API (키 필요 없음) — current= 뒤에 받고 싶은 값을 적어요
    weather: "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + PLACE.latitude
      + "&longitude=" + PLACE.longitude
      + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day"
      + "&timezone=Asia%2FSeoul",
  };

  // 날씨 코드(WMO) → 한국어 + 이모지
  const WEATHER_CODES = {
    0:  ["맑음", "☀️"],
    1:  ["대체로 맑음", "🌤️"],
    2:  ["구름 조금", "⛅"],
    3:  ["흐림", "☁️"],
    45: ["안개", "🌫️"],
    48: ["서리 안개", "🌫️"],
    51: ["약한 이슬비", "🌦️"],
    53: ["이슬비", "🌦️"],
    55: ["강한 이슬비", "🌧️"],
    56: ["약한 어는 이슬비", "🌧️"],
    57: ["강한 어는 이슬비", "🌧️"],
    61: ["약한 비", "🌦️"],
    63: ["비", "🌧️"],
    65: ["강한 비", "🌧️"],
    66: ["약한 어는 비", "🌧️"],
    67: ["강한 어는 비", "🌧️"],
    71: ["약한 눈", "🌨️"],
    73: ["눈", "🌨️"],
    75: ["강한 눈", "❄️"],
    77: ["싸락눈", "🌨️"],
    80: ["약한 소나기", "🌦️"],
    81: ["소나기", "🌧️"],
    82: ["강한 소나기", "⛈️"],
    85: ["약한 눈 소나기", "🌨️"],
    86: ["강한 눈 소나기", "❄️"],
    95: ["뇌우", "⛈️"],
    96: ["뇌우와 약한 우박", "⛈️"],
    99: ["뇌우와 강한 우박", "⛈️"],
  };

  function describeWeather(code, isDay) {
    const [text, emoji] = WEATHER_CODES[code] || ["알 수 없음 (코드 " + code + ")", "❔"];
    // 밤에 맑으면 해 대신 달
    if (!isDay && (code === 0 || code === 1)) return [text, "🌙"];
    return [text, emoji];
  }

  const card = document.getElementById("weather-card");

  async function loadWeather() {
    card.innerHTML = '<p class="loading">날씨를 불러오는 중이에요…</p>';
    try {
      const res = await fetch(API.weather); // 🔌 API 호출
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const c = data.current;
      const u = data.current_units;
      const [text, emoji] = describeWeather(c.weather_code, c.is_day === 1);

      card.innerHTML = `
        <div class="now">
          <div class="emoji" aria-hidden="true">${emoji}</div>
          <div>
            <div class="temp">${Math.round(c.temperature_2m)}${u.temperature_2m}</div>
            <div class="desc">${text}</div>
          </div>
        </div>
        <dl class="details">
          <div><dt>체감 온도</dt><dd>${Math.round(c.apparent_temperature)}${u.apparent_temperature}</dd></div>
          <div><dt>습도</dt><dd>${c.relative_humidity_2m}${u.relative_humidity_2m}</dd></div>
          <div><dt>바람</dt><dd>${c.wind_speed_10m} ${u.wind_speed_10m}</dd></div>
        </dl>
        <p class="basis">기준 시각: ${c.time.replace("T", " ")} (한국 시간, 15분 간격 갱신)</p>
      `;
    } catch (err) {
      card.innerHTML = `
        <div class="error">
          <strong>날씨를 불러오지 못했어요.</strong><br>
          인터넷 연결이나 아래 🔌 API 주소를 확인해 주세요. (${err.message})<br>
          <button type="button" onclick="loadWeather()">다시 불러오기</button>
        </div>
      `;
    }
  }

  document.getElementById("place").textContent =
    `📍 ${PLACE.name} (위도 ${PLACE.latitude}, 경도 ${PLACE.longitude})`;
  document.getElementById("api-url").textContent = API.weather;
  document.getElementById("api-link").href = API.weather;

  loadWeather();
</script>
</body>
</html>
