<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도시 날씨·미세먼지</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #667085;
    --border: #e3e7ee;
    --accent: #2f6fde;
    --error-bg: #fff2f0;
    --error-text: #b42318;
    --good: #1a7f37;
    --normal: #2f6fde;
    --bad: #c4720a;
    --very-bad: #c4320a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b1f29;
      --text: #e8ebf2;
      --muted: #98a2b3;
      --border: #2c3240;
      --accent: #6c9cf0;
      --error-bg: #2d1a1a;
      --error-text: #f97066;
      --good: #4ac26b;
      --normal: #6c9cf0;
      --bad: #f0a03c;
      --very-bad: #f97066;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 20px; }

  form { display: flex; gap: 8px; }
  form label { position: absolute; left: -9999px; }
  input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
    font: inherit;
    font-size: 16px;
  }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 20px; }

  .place { margin: 0 0 4px; font-weight: 600; }
  .coords { color: var(--muted); font-size: 13px; margin: 0; }
  .others { margin: 8px 0 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  .others button {
    padding: 4px 10px;
    font-size: 13px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
  }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .card h2 { font-size: 14px; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .big { font-size: 40px; font-weight: 700; line-height: 1.1; }
  .desc { margin-top: 4px; }
  .pm-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
  .pm-row + .pm-row { border-top: 1px solid var(--border); }
  .pm-name { color: var(--muted); font-size: 13px; }
  .grade { font-weight: 700; }
  .g-good { color: var(--good); }
  .g-normal { color: var(--normal); }
  .g-bad { color: var(--bad); }
  .g-very-bad { color: var(--very-bad); }
  .basis { color: var(--muted); font-size: 12px; margin: 12px 0 0; }

  .loading { color: var(--muted); margin: 0; }
  .error {
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
  }

  .source { color: var(--muted); font-size: 13px; margin: 16px 0 0; }
  .source a { color: var(--accent); }

  .api-box {
    margin-top: 32px;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    font-size: 13px;
  }
  .api-box h2 { font-size: 15px; margin: 0 0 8px; }
  .api-box h3 { font-size: 13px; margin: 12px 0 4px; }
  .api-box code {
    display: block;
    word-break: break-all;
    background: var(--bg);
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 4px;
  }
  .api-box a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>도시 날씨·미세먼지</h1>

  <form id="search-form">
    <label for="city">도시 이름</label>
    <input id="city" type="text" value="서울" autocomplete="off">
    <button type="submit">날씨 찾기</button>
  </form>
  <p class="hint">예: 서울, 부산, 수원, Tokyo · 안 나오면 "수원시"처럼 시까지 넣어 보세요.</p>

  <div id="place-area"></div>

  <div class="cards">
    <section class="card" id="weather-card">
      <h2>🌡️ 지금 날씨</h2>
      <p class="loading">도시를 검색하면 보여 드려요.</p>
    </section>
    <section class="card" id="air-card">
      <h2>😷 미세먼지</h2>
      <p class="loading">도시를 검색하면 보여 드려요.</p>
    </section>
  </div>

  <p class="source">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (지오코딩·날씨 예보·대기질 API)</p>

  <section class="api-box">
    <h2>🔌 이 화면이 쓰는 API</h2>
    <div id="api-list"><p class="loading">아직 부른 API가 없어요.</p></div>
  </section>
</main>

<script>
  const API = {
    // 🔌 1번: 지오코딩 API — 도시 이름 → 위도·경도
    geocoding: (name) => "https://geocoding-api.open-meteo.com/v1/search"
      + "?name=" + encodeURIComponent(name) + "&count=10&language=ko",
    // 🔌 2번: 날씨 예보 API — 1번에서 찾은 위도·경도를 넣어요
    weather: (lat, lon) => "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + lat + "&longitude=" + lon
      + "&current=temperature_2m,apparent_temperature,weather_code,is_day&timezone=auto",
    // 🔌 3번: 대기질 API — 1번에서 찾은 위도·경도를 넣어요
    air: (lat, lon) => "https://air-quality-api.open-meteo.com/v1/air-quality"
      + "?latitude=" + lat + "&longitude=" + lon
      + "&current=pm10,pm2_5&timezone=auto",
  };

  // 날씨 코드(WMO) → 한국어 + 이모지
  const WEATHER_CODES = {
    0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["구름 조금", "⛅"], 3: ["흐림", "☁️"],
    45: ["안개", "🌫️"], 48: ["서리 안개", "🌫️"],
    51: ["약한 이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["강한 이슬비", "🌧️"],
    56: ["약한 어는 이슬비", "🌧️"], 57: ["강한 어는 이슬비", "🌧️"],
    61: ["약한 비", "🌦️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"],
    66: ["약한 어는 비", "🌧️"], 67: ["강한 어는 비", "🌧️"],
    71: ["약한 눈", "🌨️"], 73: ["눈", "🌨️"], 75: ["강한 눈", "❄️"], 77: ["싸락눈", "🌨️"],
    80: ["약한 소나기", "🌦️"], 81: ["소나기", "🌧️"], 82: ["강한 소나기", "⛈️"],
    85: ["약한 눈 소나기", "🌨️"], 86: ["강한 눈 소나기", "❄️"],
    95: ["뇌우", "⛈️"], 96: ["뇌우와 약한 우박", "⛈️"], 99: ["뇌우와 강한 우박", "⛈️"],
  };

  // 한국 환경부 미세먼지 예보 등급 (단위 ㎍/㎥, 각 구간의 최댓값)
  const PM10_GRADES = [[30, "좋음", "good"], [80, "보통", "normal"], [150, "나쁨", "bad"], [Infinity, "매우나쁨", "very-bad"]];
  const PM25_GRADES = [[15, "좋음", "good"], [35, "보통", "normal"], [75, "나쁨", "bad"], [Infinity, "매우나쁨", "very-bad"]];

  function grade(value, table) {
    const v = Math.round(value);
    return table.find(([max]) => v <= max);
  }

  const placeArea = document.getElementById("place-area");
  const weatherCard = document.getElementById("weather-card");
  const airCard = document.getElementById("air-card");

  // 이번 검색에서 실제로 부른 주소들 (🔌 상자에 보여 줘요)
  let calledUrls = [];

  function recordUrl(label, url) {
    calledUrls.push({ label, url });
    document.getElementById("api-list").innerHTML = calledUrls.map(({ label, url }) => `
      <h3>${label}</h3>
      <code>${url}</code>
      <a href="${url}" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기</a>
    `).join("");
  }

  function errorBox(message, err) {
    return `<div class="error"><strong>${message}</strong><br>🔌 API 주소나 인터넷 연결을 확인해 주세요. (${err.message})</div>`;
  }

  async function fetchJson(url) {
    const res = await fetch(url); // 🔌 API 호출
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  // "부산"처럼 짧게 쓰면 작은 마을만 나올 때가 있어서,
  // 인구 정보가 있는 진짜 도시가 안 나오면 "부산광역시", "수원시"처럼 붙여서 다시 찾아요.
  async function findPlaces(name) {
    const tries = [name];
    if (/[가-힣]$/.test(name) && !/(시|군|구|도)$/.test(name)) {
      tries.push(name + "특별시", name + "광역시", name + "시");
    }
    let firstResults = [];
    for (const query of tries) {
      const url = API.geocoding(query);
      recordUrl("1번 지오코딩 · \"" + query + "\"", url);
      const data = await fetchJson(url);
      const results = data.results || [];
      if (!firstResults.length) firstResults = results;
      if (results.some((r) => r.population)) return sortByPopulation(results);
    }
    return sortByPopulation(firstResults);
  }

  function sortByPopulation(results) {
    return [...results].sort((a, b) => (b.population || 0) - (a.population || 0));
  }

  function placeLabel(p) {
    return [p.name, p.admin1, p.country].filter((x, i, arr) => x && arr.indexOf(x) === i).join(", ");
  }

  async function search(name) {
    calledUrls = [];
    placeArea.innerHTML = '<p class="loading">도시를 찾는 중이에요…</p>';
    weatherCard.innerHTML = '<h2>🌡️ 지금 날씨</h2><p class="loading">기다리는 중…</p>';
    airCard.innerHTML = '<h2>😷 미세먼지</h2><p class="loading">기다리는 중…</p>';

    let places;
    try {
      places = await findPlaces(name);
    } catch (err) {
      placeArea.innerHTML = errorBox("도시를 찾지 못했어요.", err);
      weatherCard.innerHTML = '<h2>🌡️ 지금 날씨</h2><p class="loading">도시를 먼저 찾아야 해요.</p>';
      airCard.innerHTML = '<h2>😷 미세먼지</h2><p class="loading">도시를 먼저 찾아야 해요.</p>';
      return;
    }

    if (!places.length) {
      placeArea.innerHTML = `<div class="error"><strong>"${name}"(이)라는 곳을 찾지 못했어요.</strong><br>철자를 확인하거나 "수원시", "Suwon"처럼 다르게 입력해 보세요.</div>`;
      weatherCard.innerHTML = '<h2>🌡️ 지금 날씨</h2><p class="loading">—</p>';
      airCard.innerHTML = '<h2>😷 미세먼지</h2><p class="loading">—</p>';
      return;
    }

    showPlace(places[0], places.slice(1, 5));
  }

  function showPlace(place, others) {
    placeArea.innerHTML = `
      <p class="place">📍 ${placeLabel(place)}</p>
      <p class="coords">위도 ${place.latitude}, 경도 ${place.longitude}</p>
      ${others.length ? '<div class="others" id="others"></div>' : '<div style="height:16px"></div>'}
    `;
    if (others.length) {
      const box = document.getElementById("others");
      box.insertAdjacentHTML("beforeend", '<span class="hint" style="margin:0">다른 곳?</span>');
      others.forEach((p) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = placeLabel(p);
        b.addEventListener("click", () => {
          // 지오코딩 주소는 남기고, 날씨·대기질 주소만 새로 기록
          calledUrls = calledUrls.filter((u) => u.label.startsWith("1번"));
          showPlace(p, others.filter((o) => o !== p).concat(place).slice(0, 4));
        });
        box.appendChild(b);
      });
    }

    // 날씨와 미세먼지는 따로 불러요 — 하나가 실패해도 다른 카드는 보여요
    loadWeather(place.latitude, place.longitude);
    loadAir(place.latitude, place.longitude);
  }

  async function loadWeather(lat, lon) {
    weatherCard.innerHTML = '<h2>🌡️ 지금 날씨</h2><p class="loading">날씨를 불러오는 중이에요…</p>';
    const url = API.weather(lat, lon);
    recordUrl("2번 날씨 예보", url);
    try {
      const data = await fetchJson(url);
      const c = data.current;
      let [text, emoji] = WEATHER_CODES[c.weather_code] || ["알 수 없음 (코드 " + c.weather_code + ")", "❔"];
      if (c.is_day === 0 && (c.weather_code === 0 || c.weather_code === 1)) emoji = "🌙";
      weatherCard.innerHTML = `
        <h2>🌡️ 지금 날씨</h2>
        <div class="big">${emoji} ${Math.round(c.temperature_2m)}°C</div>
        <div class="desc">${text} · 체감 ${Math.round(c.apparent_temperature)}°C</div>
        <p class="basis">기준 시각: ${c.time.replace("T", " ")} (현지 시간)</p>
      `;
    } catch (err) {
      weatherCard.innerHTML = '<h2>🌡️ 지금 날씨</h2>' + errorBox("날씨를 불러오지 못했어요.", err);
    }
  }

  async function loadAir(lat, lon) {
    airCard.innerHTML = '<h2>😷 미세먼지</h2><p class="loading">미세먼지를 불러오는 중이에요…</p>';
    const url = API.air(lat, lon);
    recordUrl("3번 대기질", url);
    try {
      const data = await fetchJson(url);
      const c = data.current;
      if (c.pm10 == null || c.pm2_5 == null) throw new Error("이 지역은 미세먼지 값이 없어요");
      const [, g10, k10] = grade(c.pm10, PM10_GRADES);
      const [, g25, k25] = grade(c.pm2_5, PM25_GRADES);
      airCard.innerHTML = `
        <h2>😷 미세먼지</h2>
        <div class="pm-row">
          <span><span class="pm-name">미세먼지 PM10</span><br>${Math.round(c.pm10)} ㎍/㎥</span>
          <span class="grade g-${k10}">${g10}</span>
        </div>
        <div class="pm-row">
          <span><span class="pm-name">초미세먼지 PM2.5</span><br>${Math.round(c.pm2_5)} ㎍/㎥</span>
          <span class="grade g-${k25}">${g25}</span>
        </div>
        <p class="basis">기준 시각: ${c.time.replace("T", " ")} · 등급은 한국 환경부 기준이에요. Open-Meteo 모델 계산값이라 에어코리아 측정값과 다를 수 있어요.</p>
      `;
    } catch (err) {
      airCard.innerHTML = '<h2>😷 미세먼지</h2>' + errorBox("미세먼지를 불러오지 못했어요.", err);
    }
  }

  document.getElementById("search-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("city").value.trim();
    if (name) search(name);
  });

  search(document.getElementById("city").value.trim());
</script>
</body>
</html>
