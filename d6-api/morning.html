<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아침 대시보드</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #667085;
    --border: #e3e7ee;
    --accent: #2f6fde;
    --error-bg: #fff2f0;
    --error-text: #b42318;
    --good: #1a7f37;
    --normal: #2f6fde;
    --bad: #c4720a;
    --very-bad: #c4320a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b1f29;
      --text: #e8ebf2;
      --muted: #98a2b3;
      --border: #2c3240;
      --accent: #6c9cf0;
      --error-bg: #2d1a1a;
      --error-text: #f97066;
      --good: #4ac26b;
      --normal: #6c9cf0;
      --bad: #f0a03c;
      --very-bad: #f97066;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  .greeting { font-size: 26px; font-weight: 700; margin: 0; }
  .today { color: var(--muted); margin: 4px 0 24px; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    min-height: 180px;
  }
  .card h2 { font-size: 14px; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .big { font-size: 36px; font-weight: 700; line-height: 1.15; }
  .desc { margin-top: 4px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
  .row + .row { border-top: 1px solid var(--border); }
  .row .label { color: var(--muted); font-size: 13px; }
  .row .value { font-weight: 700; }
  .grade { font-weight: 700; }
  .g-good { color: var(--good); }
  .g-normal { color: var(--normal); }
  .g-bad { color: var(--bad); }
  .g-very-bad { color: var(--very-bad); }
  .basis { color: var(--muted); font-size: 12px; margin: 12px 0 0; }

  .dog-img {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 12px;
    background: var(--bg);
  }
  .card button {
    margin-top: 10px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }
  .card button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .loading { color: var(--muted); margin: 0; }
  .error {
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
  }
  .error button { color: inherit; border-color: currentColor; }

  .source { color: var(--muted); font-size: 13px; margin: 16px 0 0; }
  .source a { color: var(--accent); }

  .api-box {
    margin-top: 32px;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    font-size: 13px;
  }
  .api-box h2 { font-size: 15px; margin: 0 0 8px; }
  .api-box h3 { font-size: 13px; margin: 12px 0 4px; }
  .api-box code {
    display: block;
    word-break: break-all;
    background: var(--bg);
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 4px;
  }
  .api-box a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="greeting" id="greeting"></p>
  <p class="today" id="today"></p>

  <div class="cards">
    <section class="card" id="weather-card"></section>
    <section class="card" id="rate-card"></section>
    <section class="card" id="holiday-card"></section>
    <section class="card" id="dog-card"></section>
  </div>

  <p class="source">
    Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> ·
    환율 <a href="https://frankfurter.dev/" target="_blank" rel="noopener">Frankfurter</a> (유럽중앙은행 기준 환율) ·
    공휴일 <a href="https://date.nager.at/" target="_blank" rel="noopener">Nager.Date</a> ·
    강아지 사진 <a href="https://dog.ceo/dog-api/" target="_blank" rel="noopener">Dog CEO</a>
  </p>

  <section class="api-box">
    <h2>🔌 이 화면이 쓰는 API</h2>
    <div id="api-list"></div>
  </section>
</main>

<script>
  // ── 우리 동네 설정: 이름과 위도·경도를 바꾸면 다른 동네가 나와요 ──
  const PLACE = { name: "서울 중구", latitude: 37.5665, longitude: 126.9780 };

  const API = {
    // 🔌 Open-Meteo 날씨 예보 API
    weather: "https://api.open-meteo.com/v1/forecast"
      + "?latitude=" + PLACE.latitude + "&longitude=" + PLACE.longitude
      + "&current=temperature_2m,apparent_temperature,weather_code,is_day&timezone=Asia%2FSeoul",
    // 🔌 Open-Meteo 대기질 API (미세먼지)
    air: "https://air-quality-api.open-meteo.com/v1/air-quality"
      + "?latitude=" + PLACE.latitude + "&longitude=" + PLACE.longitude
      + "&current=pm10,pm2_5&timezone=Asia%2FSeoul",
    // 🔌 Frankfurter 환율 API — 1달러가 원화·엔화로 얼마인지 (100엔 환율은 이 둘로 계산)
    rate: "https://api.frankfurter.dev/v2/rates?base=USD&quotes=KRW,JPY",
    // 🔌 Nager.Date 공휴일 API — 한국(KR)의 다가오는 공휴일 목록
    holiday: "https://date.nager.at/api/v3/NextPublicHolidays/KR",
    // 🔌 Dog CEO API — 랜덤 강아지 사진 주소
    dog: "https://dog.ceo/api/breeds/image/random",
  };

  // 날씨 코드(WMO) → 한국어 + 이모지
  const WEATHER_CODES = {
    0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["구름 조금", "⛅"], 3: ["흐림", "☁️"],
    45: ["안개", "🌫️"], 48: ["서리 안개", "🌫️"],
    51: ["약한 이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["강한 이슬비", "🌧️"],
    56: ["약한 어는 이슬비", "🌧️"], 57: ["강한 어는 이슬비", "🌧️"],
    61: ["약한 비", "🌦️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"],
    66: ["약한 어는 비", "🌧️"], 67: ["강한 어는 비", "🌧️"],
    71: ["약한 눈", "🌨️"], 73: ["눈", "🌨️"], 75: ["강한 눈", "❄️"], 77: ["싸락눈", "🌨️"],
    80: ["약한 소나기", "🌦️"], 81: ["소나기", "🌧️"], 82: ["강한 소나기", "⛈️"],
    85: ["약한 눈 소나기", "🌨️"], 86: ["강한 눈 소나기", "❄️"],
    95: ["뇌우", "⛈️"], 96: ["뇌우와 약한 우박", "⛈️"], 99: ["뇌우와 강한 우박", "⛈️"],
  };

  // 한국 환경부 미세먼지 예보 등급 (단위 ㎍/㎥, 각 구간의 최댓값)
  const PM10_GRADES = [[30, "좋음", "good"], [80, "보통", "normal"], [150, "나쁨", "bad"], [Infinity, "매우나쁨", "very-bad"]];
  const PM25_GRADES = [[15, "좋음", "good"], [35, "보통", "normal"], [75, "나쁨", "bad"], [Infinity, "매우나쁨", "very-bad"]];

  function grade(value, table) {
    const v = Math.round(value);
    return table.find(([max]) => v <= max);
  }

  // ── 공통 도우미 ──
  async function fetchJson(url) {
    const res = await fetch(url); // 🔌 API 호출
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  function loading(card, title, text) {
    card.innerHTML = `<h2>${title}</h2><p class="loading">${text}</p>`;
  }

  function fail(card, title, what, err, retryName) {
    card.innerHTML = `
      <h2>${title}</h2>
      <div class="error">
        <strong>${what} 불러오지 못했어요.</strong><br>
        🔌 API 주소나 인터넷 연결을 확인해 주세요. (${err.message})<br>
        <button type="button" onclick="${retryName}()">다시 불러오기</button>
      </div>`;
  }

  function fmtTime(t) { return t.replace("T", " "); }

  // ── 맨 위 인사말 (한국 시간 기준) ──
  function showGreeting() {
    const now = new Date();
    const hour = Number(now.toLocaleString("en-US", { timeZone: "Asia/Seoul", hour: "numeric", hourCycle: "h23" }));
    let text;
    if (hour >= 5 && hour < 11) text = "☀️ 좋은 아침이에요!";
    else if (hour >= 11 && hour < 17) text = "🍱 점심 맛있게 드셨나요?";
    else if (hour >= 17 && hour < 22) text = "🌆 오늘 하루도 수고했어요!";
    else text = "🌙 늦은 밤이에요, 푹 쉬세요.";
    document.getElementById("greeting").textContent = text;
    document.getElementById("today").textContent = now.toLocaleDateString("ko-KR", {
      timeZone: "Asia/Seoul", year: "numeric", month: "long", day: "numeric", weekday: "long",
    });
  }

  // ── 카드 1: 날씨 + 미세먼지 (두 API를 따로 불러서, 하나가 실패해도 나머지는 보여요) ──
  const weatherCard = document.getElementById("weather-card");
  const WEATHER_TITLE = "🌤️ " + PLACE.name + " 날씨·미세먼지";

  async function loadWeather() {
    loading(weatherCard, WEATHER_TITLE, "날씨를 불러오는 중이에요…");
    const [weather, air] = await Promise.allSettled([fetchJson(API.weather), fetchJson(API.air)]);

    if (weather.status === "rejected" && air.status === "rejected") {
      fail(weatherCard, WEATHER_TITLE, "날씨와 미세먼지를", weather.reason, "loadWeather");
      return;
    }

    let html = `<h2>${WEATHER_TITLE}</h2>`;

    if (weather.status === "fulfilled") {
      const c = weather.value.current;
      let [text, emoji] = WEATHER_CODES[c.weather_code] || ["알 수 없음 (코드 " + c.weather_code + ")", "❔"];
      if (c.is_day === 0 && (c.weather_code === 0 || c.weather_code === 1)) emoji = "🌙";
      html += `
        <div class="big">${emoji} ${Math.round(c.temperature_2m)}°C</div>
        <div class="desc">${text} · 체감 ${Math.round(c.apparent_temperature)}°C</div>`;
    } else {
      html += `<div class="error">날씨를 불러오지 못했어요. (${weather.reason.message})</div>`;
    }

    if (air.status === "fulfilled") {
      const a = air.value.current;
      const [, g10, k10] = grade(a.pm10, PM10_GRADES);
      const [, g25, k25] = grade(a.pm2_5, PM25_GRADES);
      html += `
        <div style="margin-top:12px">
          <div class="row"><span class="label">미세먼지 ${Math.round(a.pm10)}㎍/㎥</span><span class="grade g-${k10}">${g10}</span></div>
          <div class="row"><span class="label">초미세먼지 ${Math.round(a.pm2_5)}㎍/㎥</span><span class="grade g-${k25}">${g25}</span></div>
        </div>`;
    } else {
      html += `<div class="error" style="margin-top:12px">미세먼지를 불러오지 못했어요. (${air.reason.message})</div>`;
    }

    const time = weather.status === "fulfilled" ? weather.value.current.time : air.value.current.time;
    html += `<p class="basis">기준 시각: ${fmtTime(time)} · 미세먼지 등급은 환경부 기준</p>`;
    weatherCard.innerHTML = html;
  }

  // ── 카드 2: 환율 ──
  const rateCard = document.getElementById("rate-card");
  const RATE_TITLE = "💱 오늘의 환율";

  async function loadRate() {
    loading(rateCard, RATE_TITLE, "환율을 불러오는 중이에요…");
    try {
      const data = await fetchJson(API.rate);
      const krw = data.find((r) => r.quote === "KRW");
      const jpy = data.find((r) => r.quote === "JPY");
      if (!krw || !jpy) throw new Error("환율 값이 응답에 없어요");
      const won100Yen = 100 * krw.rate / jpy.rate; // 1달러 = krw원 = jpy엔 → 100엔 = 100 × krw ÷ jpy 원
      rateCard.innerHTML = `
        <h2>${RATE_TITLE}</h2>
        <div class="row"><span class="label">🇺🇸 1달러</span><span class="value">${krw.rate.toLocaleString("ko-KR", { maximumFractionDigits: 2 })}원</span></div>
        <div class="row"><span class="label">🇯🇵 100엔</span><span class="value">${won100Yen.toLocaleString("ko-KR", { maximumFractionDigits: 2 })}원</span></div>
        <p class="basis">기준 날짜: ${krw.date} · 실시간 시세가 아니라 그날 발표된 기준 환율이에요.</p>`;
    } catch (err) {
      fail(rateCard, RATE_TITLE, "환율을", err, "loadRate");
    }
  }

  // ── 카드 3: 다음 공휴일 D-day ──
  const holidayCard = document.getElementById("holiday-card");
  const HOLIDAY_TITLE = "🎉 다음 공휴일";

  async function loadHoliday() {
    loading(holidayCard, HOLIDAY_TITLE, "공휴일을 불러오는 중이에요…");
    try {
      const list = await fetchJson(API.holiday);
      if (!list.length) throw new Error("다가오는 공휴일이 없어요");
      const next = list[0];
      // 날짜만 비교 (한국 시간 오늘 기준)
      const todayKst = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Seoul" }); // YYYY-MM-DD
      const days = Math.round((Date.parse(next.date) - Date.parse(todayKst)) / 86400000);
      const dday = days === 0 ? "D-DAY" : "D-" + days;
      const weekday = new Date(next.date + "T00:00:00").toLocaleDateString("ko-KR", { weekday: "short" });
      holidayCard.innerHTML = `
        <h2>${HOLIDAY_TITLE}</h2>
        <div class="big">${dday}</div>
        <div class="desc">${next.localName || next.name}</div>
        <p class="basis">${next.date} (${weekday})${list[1] ? " · 그다음: " + (list[1].localName || list[1].name) + " " + list[1].date : ""}</p>`;
    } catch (err) {
      fail(holidayCard, HOLIDAY_TITLE, "공휴일을", err, "loadHoliday");
    }
  }

  // ── 카드 4: 랜덤 강아지 ──
  const dogCard = document.getElementById("dog-card");
  const DOG_TITLE = "🐶 오늘의 강아지";

  async function loadDog() {
    loading(dogCard, DOG_TITLE, "강아지를 데려오는 중이에요…");
    try {
      const data = await fetchJson(API.dog);
      if (data.status !== "success") throw new Error("사진 주소를 받지 못했어요");
      // 주소 모양: .../breeds/견종이름/파일.jpg → 견종 이름만 꺼내요
      const breed = (data.message.split("/breeds/")[1] || "").split("/")[0].replace("-", " ");
      dogCard.innerHTML = `
        <h2>${DOG_TITLE}</h2>
        <img class="dog-img" alt="랜덤 강아지 사진 (${breed})">
        <button type="button" onclick="loadDog()">🔄 다른 강아지 보기</button>`;
      const img = dogCard.querySelector("img");
      img.onerror = () => fail(dogCard, DOG_TITLE, "강아지 사진을", new Error("사진 파일을 열 수 없어요"), "loadDog");
      img.src = data.message;
    } catch (err) {
      fail(dogCard, DOG_TITLE, "강아지 사진을", err, "loadDog");
    }
  }

  // ── 🔌 API 상자 ──
  const API_LABELS = {
    weather: "날씨 예보 (Open-Meteo)",
    air: "대기질 (Open-Meteo)",
    rate: "환율 (Frankfurter)",
    holiday: "다음 공휴일 (Nager.Date)",
    dog: "랜덤 강아지 (Dog CEO)",
  };
  document.getElementById("api-list").innerHTML = Object.entries(API).map(([key, url]) => `
    <h3>${API_LABELS[key]}</h3>
    <code>${url}</code>
    <a href="${url}" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기</a>
  `).join("");

  // ── 시작: 카드마다 따로 불러요 (하나가 실패해도 나머지는 보여요) ──
  showGreeting();
  loadWeather();
  loadRate();
  loadHoliday();
  loadDog();
</script>
</body>
</html>
